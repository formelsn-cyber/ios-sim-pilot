name: ios-sim-pilot
on:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[(rt,x['name'],x['udid']) for rt,devs in d.items() if 'iOS' in rt for x in devs if x['name'].startswith('iPhone') and x['isAvailable']]; c.sort(); print(c[-1][2])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
      - name: Install Appium
        run: |
          npm install -g appium@latest
          appium driver install xcuitest
          python3 -m venv venv && ./venv/bin/pip install Appium-Python-Client
          nohup appium --log-level info > appium.log 2>&1 &
          sleep 10
          curl -s http://127.0.0.1:4723/status | head -c 300
      - name: Run scenario
        run: |
          mkdir -p shots
          ./venv/bin/python act2.py || true
          tail -40 appium.log > shots/appium-tail.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          retention-days: 3
