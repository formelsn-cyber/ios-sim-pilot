name: ios-sim-pilot
on:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[(rt,x['name'],x['udid']) for rt,devs in d.items() if 'iOS' in rt for x in devs if x['name'].startswith('iPhone') and x['isAvailable']]; c.sort(); print(c[-1][2])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
      - name: Install idb
        run: |
          brew tap facebook/fb
          brew install idb-companion
          pip3 install --break-system-packages fb-idb
          idb --help | head -3
      - name: Run scenario
        run: |
          mkdir -p shots
          xcrun simctl openurl "$UDID" "https://yombal.sn/"
          sleep 30
          xcrun simctl io "$UDID" screenshot shots/00-home.png
          python3 act.py "Installer l" "Plus" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
          retention-days: 3
